<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOID ARK · 보스 파괴 엔딩</title><body><main style="max-width:700px;margin:12vh auto;padding:24px;color:#eafffc"><h1>보스 파괴 · 클로즈업 엔딩</h1><p>실제 행성 보스 선체가 분리·폭발한 뒤 아크 선단의 해방 장면으로 이어집니다.</p><select id="planet" aria-label="엔딩 행성"></select><button id="play">엔딩 영상 재생</button><p id="status" role="status">재생할 행성을 선택하세요.</p><a id="download" hidden download="VOID-ARK-boss-ending.webm">녹화 영상 다운로드</a><p>미리보기는 게임 저장과 진행도를 변경하지 않습니다.</p><a href="./index.html">게임 메뉴로</a></main><script type="module">
import '/src/style.css';import {preparePlanetEnding,playPlanetEnding} from '/src/planet-ending.js';import {CAMPAIGN_STAGES} from '/src/solar-campaign.js';
const select=document.querySelector('#planet'),button=document.querySelector('#play'),status=document.querySelector('#status'),link=document.querySelector('#download');for(const stage of CAMPAIGN_STAGES){const option=document.createElement('option');option.value=stage.index;option.textContent=stage.name;select.append(option);}let close,recording,url;const meta={ship:'ark',tree:{},base:{},research:{}};
button.onclick=async()=>{button.disabled=true;select.disabled=true;link.hidden=true;status.textContent='보스 모델과 엔딩 장면 준비 중…';const index=Number(select.value),prepared=preparePlanetEnding(index,meta);try{if(!await prepared.ready)throw Error('준비 실패');const chunks=[],type=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>window.MediaRecorder?.isTypeSupported(t));if(type&&prepared.canvas.captureStream){const stream=prepared.canvas.captureStream(30);recording=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:7000000});recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recording.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob(chunks,{type}));link.href=url;link.hidden=false;};recording.start();}status.textContent='클로즈업 → 코어 연쇄 폭발 → 행성 해방';close=playPlanetEnding({campaign:{index},stage:2},meta,()=>{recording?.state==='recording'&&recording.stop();close=null;button.disabled=false;select.disabled=false;status.textContent='재생 완료 · 다시 재생하거나 녹화 영상을 내려받으세요.';},prepared);}catch(error){prepared.dispose();button.disabled=false;select.disabled=false;status.textContent='영상 준비 실패 · 다시 재생해주세요.';console.error(error);}};
window.addEventListener('pagehide',()=>{close?.();if(recording?.state==='recording')recording.stop();if(url)URL.revokeObjectURL(url);});
</script></body></html>
