<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VOID ARK · 행성별 적 3D 도감</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e19;color:#eaf3ff;font:14px sans-serif}header{flex-wrap:wrap;padding:24px 24px 8px;display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0 0 12px}p{color:#9fb5cc;margin:0}a.return-game{display:inline-block;color:#80ebc5;text-decoration:none;border:1px solid #3c637c;border-radius:8px;padding:10px;margin-top:12px}.gallery-controls{display:flex;gap:10px;flex-wrap:wrap}select{background:#172638;color:#dcf2ff;border:1px solid #3c637c;padding:12px;border-radius:8px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:24px}article{border:1px solid #293e52;background:linear-gradient(#152438,#0b1420);border-radius:12px;overflow:hidden}h2{font-size:17px;margin:14px 16px 8px}small{display:block;margin:0 16px 8px;color:#a9bfd2}canvas{width:100%;height:auto;aspect-ratio:400/260;display:block}.state{padding:10px 16px;font-size:12px;color:#8aadc9;border-top:1px solid #26394e}.ready{color:#80ebc5}.failed{color:#ffbd84}#gallery-status{margin:12px 24px 0;line-height:1.5}#retry-models{margin:12px 24px 0;padding:12px;min-height:44px;max-width:calc(100% - 48px);background:#172638;color:#ffbd84;border:1px solid #3c637c;border-radius:8px}footer{padding:0 24px 24px;color:#97acc1}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){header{padding:18px 18px 8px;gap:14px}header>div:last-child{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}select{width:100%;min-width:0;min-height:44px;padding:10px 8px}a.return-game{min-height:44px;display:inline-flex;align-items:center}#grid{padding:18px;gap:10px}}</style><header><div><h1>VOID ARK · 행성별 적 3D 도감</h1><a class="return-game" href="./index.html">← 게임 메뉴로</a><p>독립 제작한 행성별 선체 · 실제 게임 모델과 PBR 재질</p></div><div class="gallery-controls"><select disabled id="hull" aria-label="적 모델 종류"><option value="fighter">전투함 · 호위대</option><option value="capital">지휘 항모</option><option value="fortress">궤도 요새</option><option value="warden">수호자 · 중간보스</option><option value="boss">총독 · 선체 파괴형</option></select><select disabled id="role" aria-label="호위대 전투 역할"><option value="striker">돌격 · 공격 선두</option><option value="guard">수호 · 실드 장치</option><option value="gunner">포격 · 포탑 장치</option><option value="support">지원 · 수복 장치</option></select><select disabled id="view" aria-label="모델 관측 거리"><option value="fit">선체 맞춤</option><option value="compare">같은 거리 · 역할 비교</option><option value="far">원거리 · 4배 확대</option></select><select disabled id="angle" aria-label="모델 회전 방향"><option value="0">방향 · 기본</option><option value="90">방향 · 90° 회전</option><option value="180">방향 · 180° 회전</option><option value="270">방향 · 270° 회전</option></select><select hidden disabled id="damage" aria-label="보스 선체 손상"><option value="0">보스 · 완전체</option><option value="2">보스 · 2구역 파괴</option><option value="4">보스 · 4구역 파괴</option><option value="5">보스 · 5구역 파괴</option></select></div></header><p id="gallery-status" role="status" aria-live="polite">도감 준비 중 · 장비와 모델을 불러옵니다</p><button id="retry-models" hidden>실패한 모델 다시 불러오기</button><div id="grid"></div><footer>원본 2K PBR 재질 · 게임용 텍스처 최적화 · 호위대 역할별 실제 무장·실드·수복 장치 · 같은 거리로 비교 가능</footer><script type="module">
import * as THREE from 'three';import {readPlanetGalleryState,planetGalleryURL} from '/src/planet-gallery-state.js';
import {createPlanetEnemy,animateShip} from '/src/models.js';
import {PLANET_ENEMIES} from '/src/planet-enemies.js';
import {CAMPAIGN_STAGES} from '/src/solar-campaign.js';
import {acquireWarmupAssets} from '/src/asset-library.js';
import {ShipDetailLOD} from '/src/ship-detail-lod.js';
const equipment=acquireWarmupAssets(['module-cannon','module-shield','module-reactor']);await equipment.ready;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(400,260);renderer.setPixelRatio(1);renderer.setClearColor(0x101c2b);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
const progress=document.querySelector('#gallery-status'),grid=document.querySelector('#grid'),retry=document.querySelector('#retry-models');let active=[],generation=0;const select=document.querySelector('#hull'),roleSelect=document.querySelector('#role'),viewSelect=document.querySelector('#view'),damageSelect=document.querySelector('#damage'),angleSelect=document.querySelector('#angle');const roles={striker:'돌격 · 공격 선두',guard:'수호 · 실드 장치',gunner:'포격 · 포탑 장치',support:'지원 · 수복 장치'};
const initial=readPlanetGalleryState(location.search);for(const [key,control] of Object.entries({hull:select,role:roleSelect,view:viewSelect,damage:damageSelect,angle:angleSelect}))control.value=initial[key];function saveSelection(){history.replaceState(null,'',planetGalleryURL(location.href,{hull:select.value,role:roleSelect.value,view:viewSelect.value,damage:damageSelect.value,angle:angleSelect.value}));}
function releaseCards(){for(const x of active){x.lod?.dispose();x.model.userData.dispose();x.scene.clear();}active=[];}
let closed=false;window.addEventListener('pagehide',event=>{if(event.persisted||closed)return;closed=true;generation++;releaseCards();equipment.release();renderer.dispose();});
async function renderCards(){const gen=++generation,total=CAMPAIGN_STAGES.length;let remaining=total,failures=0;progress.dataset.completed='0';progress.dataset.failed='0';progress.textContent='모델 준비 0 / '+total;grid.setAttribute('aria-busy','true');retry.hidden=true;releaseCards();document.querySelector('#grid').replaceChildren();const role=select.value,isBoss=role==='boss'||role==='warden';roleSelect.disabled=role!=='fighter';damageSelect.disabled=!isBoss;roleSelect.hidden=roleSelect.disabled;damageSelect.hidden=damageSelect.disabled;
for(const stage of CAMPAIGN_STAGES){const card=document.createElement('article');card.innerHTML=`<h2>${stage.name}</h2><small>${PLANET_ENEMIES[stage.id].name}</small>`;const canvas=document.createElement('canvas');canvas.width=400;canvas.height=260;card.append(canvas);const state=document.createElement('div');state.className='state';state.textContent='3D 모델 로딩 중';card.append(state);document.querySelector('#grid').append(card);
const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xe7f3ff,0x344358,2.4));for(const [col,power,pos] of [[0xe5f3ff,4,[5,8,-5]],[0x96caed,2,[-5,2,6]]]){const lamp=new THREE.DirectionalLight(col,power);lamp.position.set(...pos);scene.add(lamp);}const model=createPlanetEnemy({planetTheme:stage.id,kind:role==='fortress'?'planetBase':'interceptor',fleetRole:role==='capital'||isBoss?'flagship':roleSelect.value,campaignBase:role==='fortress',campaignBoss:role==='boss'?'crown':role==='warden'?'warden':undefined,radius:3});scene.add(model);model.rotation.y=-.25;const camera=new THREE.PerspectiveCamera(35,400/260,.1,200);
const item={scene,model,camera,canvas,lod:null,state,label:null};card.dataset.modelInstance=model.uuid;active.push(item);const draw=()=>{model.rotation.y=-.25+Number(angleSelect.value)*Math.PI/180;card.dataset.angle=angleSelect.value;if(isBoss){const lost=Number(damageSelect.value),order=[4,1,3,5,2];for(const part of model.userData.parts)part.visible=true;for(const index of order.slice(0,lost))if(model.userData.parts[index])model.userData.parts[index].visible=false;for(const engine of model.userData.engines)engine.visible=model.userData.parts[5]?.visible??true;card.dataset.bossVisibleSections=String(model.userData.parts.filter(part=>part.visible).length);card.dataset.damage=String(lost);card.dataset.bossEngineParts=JSON.stringify(model.userData.engines.map(e=>e.userData.bossPart));card.dataset.bossVisibleEngines=String(model.userData.engines.filter(e=>e.visible&&e.parent?.visible).length);card.dataset.bossMountedWeapons=String(model.userData.planetBossWeapons?.length||0);card.dataset.bossWeaponParts=JSON.stringify(model.userData.planetBossWeapons?.map(m=>m.section)||[]);card.dataset.bossVisibleWeapons=String(model.userData.turrets.filter(t=>t.parent?.visible).length);}model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),c=b.getCenter(new THREE.Vector3()),extent=b.getSize(new THREE.Vector3()),r=Math.max(...extent.toArray())*.5;const center=viewSelect.value!=='fit'?new THREE.Vector3():c;camera.position.copy(center).add(new THREE.Vector3(.75,1,1.2).normalize().multiplyScalar(viewSelect.value==='far'?150:viewSelect.value==='compare'?(role==='fighter'?18:isBoss?72:36):r*3.25));card.dataset.cameraDistance=camera.position.distanceTo(center).toFixed(6);card.dataset.modelScale=String(model.userData.visualRoot.scale.x);if(isBoss)card.dataset.bossRank=role==='warden'?'warden':'crown';camera.lookAt(center);camera.updateMatrixWorld(true);if(item.lod){item.lod.mode=viewSelect.value==='far'?'adaptive':'full';item.lod.update(camera,260);card.dataset.detailLevel=item.lod.level;}renderer.render(scene,camera);const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;if(viewSelect.value==='far')ctx.drawImage(renderer.domElement,150,97.5,100,65,0,0,400,260);else ctx.drawImage(renderer.domElement,0,0);};item.draw=()=>{draw();card.dataset.view=viewSelect.value;if(item.label!==null)state.textContent=item.label+(isBoss?' · 손상 '+damageSelect.value+'/5':'')+(viewSelect.value==='far'?' · 원거리 간소화 · 화면 4배 확대':'');};item.draw();
model.userData.assetReady?.then(ready=>{if(gen!==generation)return;remaining--;if(!ready)failures++;progress.dataset.completed=String(total-remaining);progress.dataset.failed=String(failures);progress.textContent=remaining?'모델 준비 '+(total-remaining)+' / '+total:failures?'준비 완료 '+(total-failures)+' / '+total+' · '+failures+'개 로딩 실패':total+'개 행성 모델 준비 완료';if(!remaining)grid.setAttribute('aria-busy','false');animateShip(model,0,{thrust:.5});item.lod=new ShipDetailLOD(model);item.lod.rebuild();card.dataset.assetReady=String(ready);card.dataset.assetId=model.userData.planetAssetId;card.dataset.fleetRole=role==='fighter'?roleSelect.value:'flagship';card.dataset.view=viewSelect.value;card.dataset.bossSections=String(model.userData.meshyBossSections||0);state.textContent=ready?'Meshy-6 · PBR 완성 모델'+(role==='fighter'?' · '+roles[roleSelect.value]:isBoss?' · '+(role==='warden'?'수호자':'총독'):''):'모델 로딩 실패 · 임시 형상';item.label=state.textContent;item.draw();state.classList.toggle('ready',ready);state.classList.toggle('failed',!ready);if(!ready)retry.hidden=false;});}}
for(const control of [select,roleSelect])control.addEventListener('change',()=>{saveSelection();renderCards();});for(const control of [viewSelect,damageSelect,angleSelect])control.addEventListener('change',()=>{saveSelection();for(const item of active)item.draw();});retry.addEventListener('click',renderCards);select.disabled=false;viewSelect.disabled=false;angleSelect.disabled=false;renderCards();
</script></html>
