<!doctype html><meta charset="utf-8"><title>VOID ARK PC 밀집 전투 검수</title>
<style>body{margin:0;background:#06101b;color:#b7eaf0;font:13px sans-serif}button{padding:9px;margin:5px}iframe{border:0;width:1280px;height:720px;display:block}pre{white-space:pre-wrap;max-width:1280px}#status{display:inline}</style>
<button id="pixels" disabled>발광 재질 화면 비교</button><button id="run" disabled>120척 전투 측정 시작</button><button id="finish" disabled>검수 종료</button><span id="status">게임 준비 중</span>
<button id="smoke" disabled>저장 없이 일반 플레이 검수</button><button id="record" disabled>현재 검수 상태 기록</button><pre id="smoke-state"></pre><iframe id="battle" src="/index.html?qa=1&gpuProfile=0&qaNoSave=1&qaFresh=1&qaStorageAudit=1"></iframe><pre id="result"></pre>
<script type="module">
const frame=document.querySelector('#battle'),run=document.querySelector('#run'),finish=document.querySelector('#finish'),status=document.querySelector('#status'),result=document.querySelector('#result');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let stop=()=>{};
const ready=setInterval(()=>{if(frame.contentWindow.__VOID_QA__){clearInterval(ready);run.disabled=false;document.querySelector('#pixels').disabled=false;document.querySelector('#smoke').disabled=false;status.textContent='1280×720 HIGH · 120척 유지 · 30초 준비 후 90초 측정';}},100);
let smokeBaseline=null,smokeErrors=[];document.querySelector('#smoke').onclick=()=>{const w=frame.contentWindow;smokeBaseline=w.localStorage.getItem('void-ark-save-v1');w.addEventListener('error',e=>smokeErrors.push(e.message));w.__VOID_QA__.sandboxSession();document.querySelector('#record').disabled=false;finish.disabled=false;status.textContent='일반 조작 검수 · 시간 가속/무적 없음 · 저장 차단';};document.querySelector('#record').onclick=()=>{const w=frame.contentWindow,a=w.__VOID_ARK__,s=a.snapshot(),d=a.diagnostics();document.querySelector('#smoke-state').textContent=JSON.stringify({phase:s.phase,time:s.time,hp:s.hp,enemies:s.enemies.length,level:s.level,bank:a.meta().bank,fps:d.fps,savePreserved:smokeBaseline===w.localStorage.getItem('void-ark-save-v1'),errors:smokeErrors});};finish.onclick=()=>{stop();frame.contentWindow.__VOID_QA__?.sandboxSession();status.textContent='검수 종료 · 저장 차단 메뉴';};
document.querySelector('#pixels').onclick=()=>{history.replaceState(null,'','?pixel');run.click();};
window.addEventListener('unhandledrejection',e=>{result.textContent=JSON.stringify({failure:String(e.reason),stack:e.reason?.stack});status.textContent='검수 실패';});
run.onclick=async()=>{
 run.disabled=true;finish.disabled=false;const w=frame.contentWindow,q=w.__VOID_QA__,s=q.sim,selectedQuality=w.document.querySelector('select[data-setting=quality]').value,baseline=w.localStorage.getItem('void-ark-save-v1'),errors=[];
 w.addEventListener('error',e=>errors.push(e.message));q.sandboxSession({ship:'bastion',fleetRank:5});let seed=91471;
 s.random=()=>{seed+=0x6D2B79F5;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
 q.start(0);q.fixedResolution();s.level=22;s.xpNeed=Infinity;s.stage=2;s.syncFleet();s.time=240;
 Object.assign(s.upgrades,{cannon:4,chain:4,missile:4,laser:3,fighter:4,shield:3});s.syncAllies();const templates=s.enemies.filter(e=>e.kind!=='boss'&&e.kind!=='planetBase');let i=0;
 while(s.enemies.length<119){const t=templates[i++%templates.length],e=s.spawn(t.kind,{x:0,y:0,z:0},false,true);for(const key of ['enemyFleet','armor','fleetRole','leaderId','captain','planetId','name','enemyAppearance','planetTheme','planetEnemy','planetEnemyRole','campaignUnit'])if(t[key]!==undefined)e[key]=t[key];if(t.enemyFleet){e.slot=i+8;e.appearanceKey=t.appearanceKey;}}
 const boss=s.spawn('boss',{x:32,y:8,z:-34});s.enemies.forEach((e,i)=>{const a=i*Math.PI*2/119,r=26+(i%4)*12;e.position={x:Math.cos(a)*r,y:(i%7-3)*3.8,z:Math.sin(a)*r};e.hp=e.maxHp=1e8;e.cooldown=.2+(i%12)*.13;});boss.position={x:32,y:8,z:-34};s.player.hp=s.player.maxHp=1e6;s.player.shield=s.player.maxShield=55;
 const drive=setInterval(()=>{s.player.hp=s.player.maxHp;if(s.campaign){s.campaign.combatKills=0;s.campaign.spawnTimer=10;}for(const a of s.fleet){a.hp=a.maxHp;a.disabled=0;}const p=s.player.position,t=s.time;for(const e of s.enemies){e.hp=e.maxHp;if(Math.hypot(e.position.x-p.x,e.position.y-p.y,e.position.z-p.z)>105){const a=e.id*2.4;e.position={x:p.x+Math.cos(a)*65,y:p.y+(e.id%5-2)*5,z:p.z+Math.sin(a)*65};}}q.setInput({x:Math.cos(t*.1)*.25-p.x*.02,z:Math.sin(t*.1)*.25-p.z*.02,y:Math.sin(t*.14)*.1-p.y*.02});},100);
 const skills=setInterval(()=>{if(s.phase==='playing')for(const id of ['pulse','barrage','overcharge']){s.skillTimers[id]=0;s.castSkill(id);}},3500);
 const samples=[];let capture=false;const start=performance.now();const observe=setInterval(()=>{const d=w.__VOID_ARK__.diagnostics(),fx=q.effectDiagnostics();const sample={at:(performance.now()-start)/1000,phase:s.phase,enemies:s.enemies.length,bosses:s.enemies.filter(e=>e.kind==='boss').length,shots:s.shots.length,fleet:s.fleet.length,allies:s.allies.length,liveParticles:fx.liveParticles,liveChunks:fx.liveChunks,drawCalls:d.drawCalls,scale:d.renderScale,fps:d.fps,scheduler:d.scheduler,hidden:w.document.hidden};status.textContent=`${capture?'측정':'준비'} ${sample.at.toFixed(0)}초 · ${sample.fps}FPS · ${sample.enemies}척 · ${sample.shots}탄 · ${sample.liveParticles}입자`;if(capture)samples.push(sample);},5000);
 stop=()=>{clearInterval(drive);clearInterval(skills);clearInterval(observe);q.setInput({});};
 await sleep(30000);if(location.search.includes('pixel')){stop();s.phase='paused';q.fixedCamera();await sleep(500);const pixels=await q.projectileGlowPixelProbe();const live=q.projectileGlowDiagnostics(),audit=q.batchIntegrationCheck();q.sandboxSession();await sleep(350);result.textContent=JSON.stringify({pixels,live,afterClear:q.projectileGlowDiagnostics(),audit,errors,savePreserved:baseline===w.localStorage.getItem('void-ark-save-v1')});status.textContent='화면·해제 비교 완료';return;}q.beginProfile();capture=true;await sleep(90000);const profile=q.endProfile();capture=false;stop();s.phase='paused';result.textContent=JSON.stringify({variant:location.port==='4275'?'baseline':'glow-candidate',profile,samples,savePreserved:baseline===w.localStorage.getItem('void-ark-save-v1'),errors,collectorPhase:'profile-collected-audit-pending'});await sleep(350);if(location.port!=='4272')await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 const report={variant:location.port==='4275'?'baseline':'glow-candidate',profile,samples,audit:q.batchIntegrationCheck(),savePreserved:baseline===w.localStorage.getItem('void-ark-save-v1'),errors,config:{width:w.innerWidth,height:w.innerHeight,quality:selectedQuality,scale:1,level:22,count:120,seed:91471,warmupSeconds:30,captureSeconds:90,normalCampaign:false,invulnerable:true,enemiesHeldAlive:true}};result.textContent=JSON.stringify(report);status.textContent=`완료 · ${profile.fps.toFixed(2)}FPS · p95 ${profile.times.frame.p95}ms · p99 ${profile.times.frame.p99}ms · 최대 ${profile.times.frame.max.toFixed(1)}ms`;
};
</script>
